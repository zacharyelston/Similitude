[project]
name = "froude"
version = "0.1.0"
description = "An open-source, AI-assisted toolkit for sizing, simulating and optimizing physical designs across air, water and structure"
readme = "README.md"
authors = [
    { name = "Zac Elston", email = "zacelston@aol.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"
