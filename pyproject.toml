[project]
name = "similitude"
version = "0.1.0"
description = "An open-source, AI-assisted platform for sizing, simulating and optimizing machines that work in air, water, ground and fields"
readme = "README.md"
authors = [
    { name = "Zac Elston", email = "zacelston@aol.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"
